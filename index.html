<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Happy Birthday 🎂</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <main class="page">
      <section id="startScreen" class="screen">
        <p class="hint">Click the helmet 👷</p>

        <button id="helmetBtn" class="helmet-button">
          <div class="helmet">
            <div class="helmet-top"></div>
            <div class="helmet-brim"></div>

            <div class="helmet-ridge ridge1"></div>
            <div class="helmet-ridge ridge2"></div>
            <div class="helmet-ridge ridge3"></div>
          </div>
        </button>
      </section>

      <section id="birthdayScreen" class="screen hidden">
        <div id="confetti"></div>

        <div class="birthday-card">
          <div class="sparkles">✦ ✧ ✦</div>

          <h1>Happy Birthday!</h1>

          <!-- Birthday Photo -->
          <img src="mahmoud.jpg" alt="Birthday Photo" class="birthday-photo" />

          <div class="heart">♡</div>

          <p class="message">
            Wishing you a day full of happiness & love ياهندسه💗
          </p>

          <div class="cake">
            <div class="candles">
              <span>🕯️</span>
              <span>🕯️</span>
              <span>🕯️</span>
              <span>🕯️</span>
            </div>

            <div class="icing"></div>

            <div class="cake-body"></div>
          </div>

          <button id="againBtn" class="again">Again ✨</button>
        </div>
      </section>
    </main>

    <script src="js/script.js"></script>
  </body>
</html>
